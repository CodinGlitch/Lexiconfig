plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }

    apiJava {
        canBeResolved = true
    }

    devOnly {
        canBeDeclared = true
        extendsFrom(runtimeOnly)
    }
}

sourceSets {
    development {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath

        runtimeClasspath += configurations.devOnly
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    // --- Common --- \\

    apiJava project(path: ':api', configuration: 'apiJava')

    implementation "com.electronwill.night-config:core:${night_config_version}"
    implementation "com.electronwill.night-config:toml:${night_config_version}"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)

    dependsOn(configurations.apiJava)
    source(configurations.apiJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)

    dependsOn(configurations.apiJava)
    source(configurations.apiJava)
}

tasks.named("sourcesJar", Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.apiJava)
    from(configurations.apiJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.register('publishModrinth') {
    dependsOn("fabric:modrinth", "forge:modrinth", "neoforge:modrinth")
}

tasks.register('publishCurseForge') {
    dependsOn("fabric:curseforge", "forge:curseforge", "neoforge:curseforge")
}

tasks.register('publishSites') {
    dependsOn publishModrinth, publishCurseForge
}