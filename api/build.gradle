plugins {
    id 'java-library'
    id 'maven-publish'

    alias(libs.plugins.legacyforge)
}

base {
    archivesName = "${mod_id}-${project.name}"
}

apply from: 'https://raw.githubusercontent.com/CodinGlitch/gradle-templates/main/repository-publishers/codinglitch.gradle'

legacyForge {
    mcpVersion = libs.versions.minecraft.asProvider().get()

    parchment.minecraftVersion.set(libs.versions.parchment.minecraft.get())
    parchment.mappingsVersion.set(libs.versions.parchment.mappings.get())
}

dependencies {
    compileOnlyApi(libs.nightconfig.core)
}

configurations {
    apiJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    apiJava sourceSets.main.java.sourceDirectories.singleFile
}

java {
    toolchain {
        // we have to target Java 8 specifically for the api so older versions can use it
        // when an api version is published from a later branch of minecraft, it won't cause jvm compatibility issues
        languageVersion = JavaLanguageVersion.of(17)
    }
}