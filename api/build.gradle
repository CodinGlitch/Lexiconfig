plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

apply from: 'https://raw.githubusercontent.com/CodinGlitch/gradle-templates/main/repository-publishers/codinglitch.gradle'

base {
    archivesName = "${mod_name}-api"
}
minecraft {
    version(minecraft_version)
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

dependencies {
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
}

java {
    withSourcesJar()
    withJavadocJar()
}