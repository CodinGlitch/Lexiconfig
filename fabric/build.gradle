plugins {
    id 'multiloader-loader'
    id 'fabric-loom' version '1.10-SNAPSHOT'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation project(':api')

    implementation "com.electronwill.night-config:core:${night_config_version}"
    implementation "com.electronwill.night-config:toml:${night_config_version}"
    include "com.electronwill.night-config:core:${night_config_version}"
    include "com.electronwill.night-config:toml:${night_config_version}"

    // Compatibilities
    modCompileOnly "com.mrcrayfish:configured-common:${configured_version}"

    // Config mods
    if (config_mod == "configured") {
        modRuntimeOnly "com.mrcrayfish:configured-fabric:${configured_version}"
    } else if (config_mod == "cloth_config") {

    } else if (config_mod == "owo") {

    } else if (config_mod == "config_screens") {

    }
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}